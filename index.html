<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Builder</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --ink: #16202a;
    --muted: #5d6b78;
    --line: #dce2e8;
    --accent: #2457d6;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a;
      --panel: #171e26;
      --ink: #e8edf2;
      --muted: #93a1ae;
      --line: #27323d;
      --accent: #6c93ff;
      --accent-ink: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  @media (min-width: 860px) { main { flex-direction: row; } }

  .preview-pane { flex: 1.2; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--line); }
  @media (min-width: 860px) {
    .preview-pane { order: 2; flex: 1; border-bottom: 0; }
    .chat-pane { order: 1; width: 380px; flex: none; border-right: 1px solid var(--line); }
  }

  .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar .spacer { flex: 1; }
  .tab, .tool {
    font: inherit; font-size: 14px; color: var(--muted); background: none;
    border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--bg); }
  .tool:hover, .tab:hover { color: var(--ink); }
  .tool:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage { flex: 1; min-height: 0; position: relative; background: #fff; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  pre {
    margin: 0; height: 100%; overflow: auto; padding: 14px; font-size: 13px; line-height: 1.5;
    background: var(--panel); color: var(--ink); white-space: pre-wrap; word-break: break-word;
  }
  .empty {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    text-align: center; color: var(--muted); background: var(--bg);
  }
  [hidden] { display: none !important; }

  .chat-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
  .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 12px; font-size: 15px; line-height: 1.45; max-width: 92%; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
  .msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
  .msg.error { align-self: flex-start; border: 1px solid #d33; color: #d33; background: transparent; }

  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  textarea {
    flex: 1; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: none; min-height: 44px; max-height: 120px;
  }
  button.send {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 0 16px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <section class="preview-pane">
    <div class="bar" role="tablist">
      <button class="tab" role="tab" id="tab-preview" aria-selected="true">Preview</button>
      <button class="tab" role="tab" id="tab-code" aria-selected="false">Code</button>
      <span class="spacer"></span>
      <button class="tool" id="copy" disabled>Copy</button>
      <button class="tool" id="download" disabled>Download</button>
    </div>
    <div class="stage">
      <iframe id="preview" title="Preview" sandbox="allow-scripts allow-forms allow-modals"></iframe>
      <pre id="code" hidden></pre>
      <div class="empty" id="empty">Describe a page or app in the chat and it will appear here.</div>
    </div>
  </section>

  <section class="chat-pane">
    <div class="messages" id="messages" aria-live="polite">
      <div class="msg bot">What do you want to build? For example: "A portfolio page for a photographer" or "A tip calculator".</div>
    </div>
    <form id="form">
      <textarea id="prompt" rows="1" placeholder="Describe it, or ask for a change" required></textarea>
      <button class="send" id="send" type="submit">Build</button>
    </form>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const messages = $('messages');
  const preview = $('preview');
  const codeView = $('code');
  let currentCode = '';

  function addMessage(text, type) {
    const el = document.createElement('div');
    el.className = 'msg ' + type;
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function showCode(code) {
    currentCode = code;
    preview.srcdoc = code;
    codeView.textContent = code;
    $('empty').hidden = true;
    $('copy').disabled = false;
    $('download').disabled = false;
  }

  function selectTab(name) {
    const isPreview = name === 'preview';
    preview.hidden = !isPreview;
    codeView.hidden = isPreview;
    $('tab-preview').setAttribute('aria-selected', isPreview);
    $('tab-code').setAttribute('aria-selected', !isPreview);
  }
  $('tab-preview').onclick = () => selectTab('preview');
  $('tab-code').onclick = () => selectTab('code');

  $('copy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(currentCode);
      $('copy').textContent = 'Copied';
      setTimeout(() => ($('copy').textContent = 'Copy'), 1500);
    } catch {
      addMessage('Could not copy. Use the Code tab and select the text.', 'error');
    }
  };

  $('download').onclick = () => {
    const url = URL.createObjectURL(new Blob([currentCode], { type: 'text/html' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    a.click();
    URL.revokeObjectURL(url);
  };

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = $('prompt').value.trim();
    if (!prompt) return;

    addMessage(prompt, 'user');
    $('prompt').value = '';
    $('send').disabled = true;
    const status = addMessage('Building...', 'bot');

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, currentCode }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');

      showCode(data.code);
      selectTab('preview');
      status.textContent = 'Done. Ask for any change, like "make the header dark" or "add a contact form".';
    } catch (err) {
      status.remove();
      addMessage(err.message, 'error');
    } finally {
      $('send').disabled = false;
      $('prompt').focus();
    }
  });

  // Enter sends, Shift+Enter makes a new line
  $('prompt').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $('form').requestSubmit();
    }
  });
</script>
</body>
</html>
